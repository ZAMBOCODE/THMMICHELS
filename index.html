<body class="overflow-x-hidden" style="opacity: 0; transition: opacity 0.3s ease;">
    <script>document.fonts.ready.then(() => { document.body.style.opacity = '1'; });</script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        // Initialize Lenis Smooth Scroll
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            orientation: 'vertical',
            gestureOrientation: 'vertical',
            smoothWheel: true,
            wheelMultiplier: 1,
            touchMultiplier: 2,
            infinite: false,
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);

        // Make lenis available globally for scrollTo functionality
        window.lenis = lenis;

        // Handle anchor links with smooth scroll
        document.addEventListener('click', (e) => {
            const target = e.target.closest('a[href^="#"], button[data-scroll-to]');
            if (target) {
                const href = target.getAttribute('href') || target.getAttribute('data-scroll-to');
                if (href && href.startsWith('#')) {
                    e.preventDefault();
                    const element = document.querySelector(href);
                    if (element) {
                        lenis.scrollTo(element, { offset: -100 });
                    }
                }
            }
        });
    </script>
